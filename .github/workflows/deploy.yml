name: Deploy Frontends to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build User App
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Build Admin App
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          cd admin
          npm ci
          npm run build

      - name: Combine Builds
        run: |
          mkdir -p dist/admin
          cp -r admin/dist/* dist/admin/

      - name: Deploy to GitHub Pages
        uses: PeaceIris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
